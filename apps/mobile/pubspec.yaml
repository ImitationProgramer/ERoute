name: eroute_mobile
description: GPS and manual-location emergency hospital map.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  crypto: ^3.0.6
  flutter_secure_storage: 10.3.3
  geolocator: ^14.0.2
  flutter_naver_map: 1.4.4
  shared_preferences: ^2.5.3
  flutter_compass: 0.8.1
  package_info_plus: 10.2.1
  url_launcher: ^6.3.2
  unorm_dart: ^0.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/illustrations/guides/
    - assets/content/emergency-guides/v1/
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf

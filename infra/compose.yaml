services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eroute
      POSTGRES_USER: ${DB_USERNAME:-eroute}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - eroute_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d eroute"]
      interval: 5s
      retries: 12
  backend:
    build:
      context: ../services/backend
    env_file: ../.env
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/eroute
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  eroute_postgres:

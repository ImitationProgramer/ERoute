name: Mobile
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get
      - run: python3 scripts/verify_emergency_guides.py --self-test
      - working-directory: apps/mobile
        run: flutter analyze
      - working-directory: apps/mobile
        run: flutter test --dart-define=EROUTE_AUTOMATION=true
      - working-directory: apps/mobile
        run: flutter build apk --debug --flavor dev --dart-define=EROUTE_AUTOMATION=true
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter build ios --simulator --debug --flavor dev --no-codesign --dart-define=EROUTE_AUTOMATION=true
